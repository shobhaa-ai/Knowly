<h1>Leave Policy</h1>

<h2>Annual Leave</h2>

<p>Employees receive 20 days of
annual paid leave per year.</p>

<h2>Sick Leave</h2>

<p>Employees receive 10 days of
sick leave per year.</p>

<h2>Leave Approval</h2>

<p>Employees should obtain manager
approval before taking planned leave.</p>
